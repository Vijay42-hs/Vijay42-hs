<svg width="900" height="160" viewBox="0 0 900 160" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a0f"/>
      <stop offset="100%" style="stop-color:#0f0f1a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#6e40c9;stop-opacity:0"/>
      <stop offset="40%" style="stop-color:#6e40c9"/>
      <stop offset="60%" style="stop-color:#58a6ff"/>
      <stop offset="100%" style="stop-color:#58a6ff;stop-opacity:0"/>
    </linearGradient>
    <linearGradient id="nameGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#e6edf3"/>
      <stop offset="60%" style="stop-color:#cdd9e5"/>
      <stop offset="100%" style="stop-color:#8b949e"/>
    </linearGradient>
    <filter id="softglow">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="900" height="160" fill="url(#bg)"/>

  <!-- Animated glow orb behind name -->
  <ellipse cx="220" cy="80" rx="160" ry="50" fill="#6e40c9" opacity="0">
    <animate attributeName="opacity" values="0;0.05;0.03;0.06;0" dur="6s" repeatCount="indefinite"/>
  </ellipse>

  <!-- Top border line drawing in -->
  <rect x="0" y="0" width="0" height="1" fill="url(#accent)" opacity="0.7">
    <animate attributeName="width" values="0;900" dur="1.8s" fill="freeze" calcMode="spline" keySplines="0.4 0 0.2 1"/>
  </rect>

  <!-- Name fades + slides in -->
  <text x="60" y="72" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif"
        font-size="42" font-weight="300" fill="url(#nameGrad)" letter-spacing="-0.5" opacity="0">
    Vijay Adithya V
    <animate attributeName="opacity" values="0;1" dur="1s" begin="0.3s" fill="freeze"/>
  </text>

  <!-- Underline draws in after name -->
  <rect x="60" y="82" width="0" height="1" fill="url(#accent)" opacity="0.9">
    <animate attributeName="width" values="0;224" dur="0.9s" begin="0.8s" fill="freeze" calcMode="spline" keySplines="0.4 0 0.2 1"/>
  </rect>

  <!-- Role tags stagger in -->
  <text x="61" y="112" font-family="'Courier New', monospace" font-size="13" fill="#6e40c9" opacity="0">
    AI Engineer
    <animate attributeName="opacity" values="0;0.9" dur="0.5s" begin="1.1s" fill="freeze"/>
  </text>
  <text x="160" y="112" font-family="'Courier New', monospace" font-size="13" fill="#484f58" opacity="0">
    ·
    <animate attributeName="opacity" values="0;0.6" dur="0.4s" begin="1.3s" fill="freeze"/>
  </text>
  <text x="174" y="112" font-family="'Courier New', monospace" font-size="13" fill="#58a6ff" opacity="0">
    Data Scientist
    <animate attributeName="opacity" values="0;0.85" dur="0.5s" begin="1.4s" fill="freeze"/>
  </text>
  <text x="280" y="112" font-family="'Courier New', monospace" font-size="13" fill="#484f58" opacity="0">
    ·
    <animate attributeName="opacity" values="0;0.6" dur="0.4s" begin="1.6s" fill="freeze"/>
  </text>
  <text x="294" y="112" font-family="'Courier New', monospace" font-size="13" fill="#8b949e" opacity="0">
    NLP Researcher
    <animate attributeName="opacity" values="0;0.8" dur="0.5s" begin="1.7s" fill="freeze"/>
  </text>

  <!-- Blinking cursor after last role -->
  <rect x="415" y="100" width="7" height="14" fill="#6e40c9" rx="1" opacity="0">
    <animate attributeName="opacity" values="0;0;0.8;0;0.8;0" dur="2s" begin="2.2s" repeatCount="indefinite"/>
  </rect>

  <!-- University line fades in last -->
  <text x="61" y="140" font-family="'Segoe UI', Arial, sans-serif" font-size="11"
        fill="#484f58" letter-spacing="2.5" opacity="0">
    AMRITA VISHWA VIDYAPEETHAM · COIMBATORE
    <animate attributeName="opacity" values="0;1" dur="0.8s" begin="1.9s" fill="freeze"/>
  </text>

  <!-- Bottom border -->
  <rect x="0" y="159" width="900" height="1" fill="url(#accent)" opacity="0.25"/>
</svg>
